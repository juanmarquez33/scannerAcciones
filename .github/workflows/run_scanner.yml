name: Nasdaq y Crypto Scanner

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas (puedes ajustarlo si prefieres)
    - cron: '0 */1 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la página de GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance requests lxml

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
